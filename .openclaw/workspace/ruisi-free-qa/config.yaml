# 预置会议数据
preset_meeting_data:
  base_dir: '/home/clawd/.openclaw/workspace/SimulatedData/PresetMeetingData'
  meeting_index_file: 'meeting_index.json'
  meeting_region: '大会议室'

# 知识库检索
knowledge:
  file_path: '/home/clawd/.openclaw/workspace/SimulatedData/KnowledgeBase/DH初始知识库.txt'
  top_k: 3 # 返回最相关的前 N 个片段
  chunk_chars: 500 # 顶级主题块超过该字数时，块内按空行/句子二次切片的目标长度
  overlap_chars: 50 # 二次切片时相邻片段的字符重叠，避免答案正好落在切口处丢失

# P02 消息发送
p02:
  api_url: 'http://127.0.0.1:18900/send'
  to_jid: 'niujunke@im.tuguan.net'
  from_account: 'test-a01@im.tuguan.net'
  token: ''
  timeout_seconds: 5
  dry_run: false

# ruisi-explanation-service 控制入口
explanation_service:
  message_service_script: '~/.openclaw/workspace_a01/skills/ruisi-explanation-service/scripts/send_message.py'
  pause_message: '暂停'

# 留痕
trace:
  enabled: true
  base_dir: './trace-workspace/ruisi-free-qa/'
