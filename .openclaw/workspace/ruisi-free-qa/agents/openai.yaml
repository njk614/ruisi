interface:
  display_name: '自由问答'
  short_description: 'OpenClaw提问形式内容强制优先触发'
  default_prompt: 'Use $ruisi-free-qa as the first-choice skill whenever OpenClaw receives question-like input, including XMPP direct chat. Do not route control intents here; they belong to ruisi-explanation-service. On questions, first call pause_explanation.py to send payload 暂停 through ruisi-explanation-service send_message.py; if there is no running demo, treat it as pause success. Then try to match the current meeting from PresetMeetingData/meeting_index.json where meeting_region is 大会议室 and time_range contains the current time; use the matched booking_id PresentationScript.json and optional CustomerProfile.md only when available, otherwise continue with knowledge-base-only answering. When profile data is available, personalize the answer with the user's friendly nickname or appropriate salutation and relevant interests, focus areas, history, industry context, or meeting topic. Do not invent missing profile details. For customer-facing answers, respond as the company virtual assistant in first-person voice (我/我们), and avoid third-person narration. Normalize semantically equivalent questions (e.g., “孪易是什么” and “介绍一下孪易”) to the same intent and keep structure/detail level consistent unless the user explicitly asks for brief or detailed mode.'

policy:
  allow_implicit_invocation: true
